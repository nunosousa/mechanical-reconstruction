[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mechanical-reconstruction"
version = "0.1.0"
description = "Tools for reconstructing mechanical geometry from photographs using 3D landmarks, camera models and curve fitting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "opencv-python>=4.10",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
